[workspace]

members = ["cache", "files", "kp", "router"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-std = "1"
async-trait = "0.1"
assert_matches = "1"
base64 = "0.23"
chrono = "0.4"
clap = "4"
dbus = "0.9"
env_logger = "0.11"
files = { path = "files" }
form_urlencoded = "1"
futures = "0.3"
http = "0.2"
hyper = "0.14"
lazy_static = "1"
libc = "0.2.190"
log = "0.4"
mockall = "0.15.0"
pkg-config = "0.3"
quick-xml = "0"
regex = "1"
router = { path = "router" }
rusqlite = "0"
rstest = "0.27"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
test-log = "0.2"
tokio = "1"
url = "2"
wiremock = "0.6"
