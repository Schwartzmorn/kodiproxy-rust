[workspace]

members = ["cache", "files", "kp", "router"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
assert_matches = "1"
base64 = "0.23"
chrono = "0.4"
clap = "4"
dbus = "0.9"
env_logger = "0.11"
files = { path = "files" }
form_urlencoded = "1"
futures = "0.3"
http = "1.5"
hyper = "1.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
lazy_static = "1"
libc = "0.2.190"
log = "0.4"
mockall = "0.15.0"
parking_lot = "0.12"
pkg-config = "0.3"
quick-xml = "0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
router = { path = "router" }
rusqlite = "0"
rstest = "0.27"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
test-log = "0.2"
tokio = "1"
tower-http = { version = "0.7", features = ["timeout"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
wiremock = "0.6"
